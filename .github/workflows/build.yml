name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
            build-essential ccache gettext

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv setuptools

      - name: Show the target API from buildozer.spec
        run: |
          API=$(grep -E '^android.api' buildozer.spec | head -1)
          echo "::notice title=spec::$API"

      - name: Point the cached dist at the target API from buildozer.spec
        run: |
          API=$(grep -E '^android.api' buildozer.spec | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "wanted API: $API"
          for f in .buildozer/android/platform/build-*/dists/*/project.properties; do
            [ -f "$f" ] || continue
            echo "before: $(grep -E '^target=' "$f")"
            sed -i -E "s/^target=android-[0-9]+/target=android-$API/" "$f"
            echo "after:  $(grep -E '^target=' "$f")  ($f)"
            echo "::notice title=dist target::$(grep -E '^target=' "$f")"
          done

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Show the target SDK of the built APK
        if: always()
        run: |
          APK=$(ls bin/*.apk 2>/dev/null | head -1)
          AAPT=$(ls ~/.buildozer/android/platform/android-sdk/build-tools/*/aapt 2>/dev/null | tail -1)
          if [ -n "$APK" ] && [ -n "$AAPT" ]; then
            T=$("$AAPT" dump badging "$APK" 2>/dev/null | grep -E "targetSdkVersion|sdkVersion:" | tr '\n' ' ')
            echo "::warning title=APK target SDK::$T"
          else
            echo "::warning title=APK target SDK::aapt or apk not found"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProPlayer-apk
          path: bin/*.apk
